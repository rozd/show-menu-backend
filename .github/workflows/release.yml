name: Release

# The single entry point for shipping a release. release-please keeps one open
# "release X.Y.Z" pull request up to date from Conventional Commits on main; merging
# that PR is the release trigger. On merge, release-please tags `vX.Y.Z`, creates a
# GitHub Release with the changelog body, and outputs release_created.
#
# Merging the release PR creates tag `vX.Y.Z` on the main branch, which triggers the
# Cloud Build production deployment (deploy) in show-menu-dev.
#
# release-please uses a GitHub App token when RELEASE_APP_CLIENT_ID and
# RELEASE_APP_PRIVATE_KEY secrets are present, and falls back to GITHUB_TOKEN.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Mint a GitHub App token
        id: app-token
        if: ${{ env.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Release please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Release summary
        if: steps.release.outputs.release_created == 'true'
        run: |
          echo "## Release Created: ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tagged on main branch. Production deployment is triggered via Cloud Build tag trigger." >> "$GITHUB_STEP_SUMMARY"
