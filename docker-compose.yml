# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#        Build images: docker compose build
#           Start app: docker compose up app
#      Local Postgres: docker compose --profile postgres up db
#            Stop all: docker compose down
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# With no DATABASE_URL set, `app` runs on an in-memory SQLite database: there is
# no volume to mount and nothing survives `docker compose down` — or any
# container restart. Accounts and tokens are lost on restart. The `db` service
# (postgres profile) provides a local Postgres; point DATABASE_URL at it
# (postgres://vapor:vapor@db:5432/vapor from inside the compose network) and the
# app switches driver with no code change (durable tokens and accounts).
#
# Passage authentication is wired: `/auth/*` routes are public, `/v1/*` routes
# protected by bearer token. Set JWKS or JWKS_FILE_PATH for persistent keys;
# without them, an ephemeral dev key is generated at startup (tokens invalid
# after restart). See "Authentication" in README.md.
#

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}

services:
  app:
    image: show-menu-backend:latest
    build:
      context: .
      secrets:
        - github_token
    environment:
      <<: *shared_environment
    ports:
      - '8080:8080'
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0"]

  # A local Postgres for projects that swapped configureFluentStore(app) into
  # configure.swift. Started only with the `postgres` profile, so plain
  # `docker compose up app` stays infrastructure-free.
  db:
    image: postgres:17-alpine
    profiles: ['postgres']
    environment:
      POSTGRES_USER: vapor
      POSTGRES_PASSWORD: vapor
      POSTGRES_DB: vapor
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vapor -d vapor']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
